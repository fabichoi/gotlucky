name: Deploy Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Public IP (With Retry)
        id: ip
        run: |          
          PUBLIC_IP=$(curl -s --retry 10 --retry-delay 3 --max-time 5 https://ifconfig.me || \
                      curl -s --retry 3 https://icanhazip.com)
          echo "ipv4=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Setting environment variables
        run: |
         echo "AWS_DEFAULT_REGION=ap-northeast-2" >> $GITHUB_ENV
         echo "AWS_SG_NAME=launch-wizard-1" >> $GITHUB_ENV
         
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      
      - name: Add Github Actions IP to Security group
        run: |
          aws ec2 authorize-security-group-ingress --group-name ${{ env.AWS_SG_NAME }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2

      - name: Copy backend files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/"
          target: "~/gotlucky"

      - name: Build and Deploy on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }} 
          username: ${{ secrets.EC2_USER }} 
          key: ${{ secrets.EC2_SSH_KEY }} 
          script: |
            set -e
            
            # 1. Install Go if missing
            if ! command -v go &> /dev/null; then
              echo "Installing Go..."
              curl -OL https://go.dev/dl/go1.22.2.linux-amd64.tar.gz
              sudo tar -C /usr/local -xzf go1.22.2.linux-amd64.tar.gz
              echo 'export PATH=$PATH:/usr/local/go/bin' >> ~/.profile
              rm go1.22.2.linux-amd64.tar.gz
            fi
            export PATH=$PATH:/usr/local/go/bin
            
            # 2. Build the Go binary
            cd ~/gotlucky/backend
            echo "Building backend..."
            go build -o gotlucky-backend cmd/main.go
            
            # 3. Create systemd service
            echo "Configuring systemd service..."
            SERVICE_FILE="/tmp/gotlucky-backend.service"
            cat > $SERVICE_FILE <<EOF
            [Unit]
            Description=GotLucky Backend Service
            After=network.target

            [Service]
            Type=simple
            User=${{ secrets.EC2_USER }}
            WorkingDirectory=/home/${{ secrets.EC2_USER }}/gotlucky/backend
            ExecStart=/home/${{ secrets.EC2_USER }}/gotlucky/backend/gotlucky-backend
            Environment="GIN_MODE=release"
            Environment="DB_PATH=/home/${{ secrets.EC2_USER }}/gotlucky/backend/gotlucky.db"
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOF
            
            sudo mv $SERVICE_FILE /etc/systemd/system/gotlucky-backend.service
            
            # 4. Reload and Restart
            sudo systemctl daemon-reload
            sudo systemctl enable gotlucky-backend
            sudo systemctl restart gotlucky-backend

      - name: Remove Github Actions IP from security group
        if: always()
        continue-on-error: true
        run: |
          aws ec2 revoke-security-group-ingress --group-name ${{ env.AWS_SG_NAME }} --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
            


