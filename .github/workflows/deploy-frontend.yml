name: Deploy Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/**,frontend/nginx.conf"
          target: "~/gotlucky"

      - name: Configure Nginx and Deploy on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }} 
          username: ${{ secrets.EC2_USER }} 
          key: ${{ secrets.EC2_SSH_KEY }} 
          script: |
            set -e
            
            # 1. Install Nginx if missing
            if ! command -v nginx &> /dev/null; then
              echo "Installing Nginx..."
              sudo apt-get update
              sudo apt-get install -y nginx
            fi
            
            # 2. Setup web directory
            sudo mkdir -p /var/www/fabichoi
            sudo rsync -a ~/gotlucky/frontend/dist/ /var/www/fabichoi/
            sudo chown -R www-data:www-data /var/www/fabichoi
            
            # 3. Configure Nginx
            NGINX_CONF="/etc/nginx/sites-available/gotlucky-frontend"
            
            # Update listen port to 3000 to match previous behavior, and set root directory
            cat ~/gotlucky/frontend/nginx.conf \
              | sed 's|listen 80;|listen 3000;|' \
              | sed 's|root /usr/share/nginx/html;|root /var/www/fabichoi;|' > /tmp/gotlucky-nginx.conf
              
            sudo mv /tmp/gotlucky-nginx.conf $NGINX_CONF
            
            # Enable site
            sudo ln -sf $NGINX_CONF /etc/nginx/sites-enabled/gotlucky-frontend
            
            # Remove default nginx site if it conflicts
            sudo rm -f /etc/nginx/sites-enabled/default
            
            # 4. Restart Nginx
            sudo systemctl restart nginx
            


